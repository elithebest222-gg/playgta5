<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play GTA V Browser Runtime</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
        #canvas { width: 100%; height: 100%; display: block; }
        #setup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 15, 0.96); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .picker-box { padding: 40px; background: #222; border-radius: 12px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #333; max-width: 450px; }
        h2 { margin-top: 0; color: #00bcd4; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .file-label { display: inline-block; padding: 12px 24px; background: #00bcd4; color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .file-label:hover { background: #00acc1; }
        input[type="file"] { display: none; }
        #status-msg { margin-top: 20px; font-weight: bold; color: #ffeb3b; }
    </style>
</head>
<body>

    <div id="setup-overlay">
        <div class="picker-box">
            <h2>GTA V WebAssembly Engine</h2>
            <p>To run this game locally without servers, select your local <strong>.mirror</strong> folder. Files stay in browser RAM and are never uploaded.</p>
            <label class="file-label" for="folder-picker">Select .mirror Folder</label>
            <input type="file" id="folder-picker" webkitdirectory directory multiple />
            <div id="status-msg"></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
